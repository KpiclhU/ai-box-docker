name: ai-docker

# Each service sits directly on the LAN with its own address — no published
# ports, no proxy in front of them. The addresses live in .env; see .env.example.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_TAG:-main}
    container_name: open-webui
    restart: unless-stopped
    # Generated by install.sh from comfy/sdxl.api.json: COMFYUI_WORKFLOW(_NODES).
    env_file:
      - ./open-webui.env
    environment:
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY:?set it in .env, or run install.sh}
      WEBUI_ADMIN_EMAIL: ${OPENWEBUI_ADMIN_EMAIL:-admin@ai-box.local}
      WEBUI_ADMIN_PASSWORD: ${OPENWEBUI_ADMIN_PASSWORD:-}
      WEBUI_ADMIN_NAME: ${OPENWEBUI_ADMIN_NAME:-Admin}
      ENABLE_SIGNUP: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      ENABLE_API_KEYS: "true"
      # The model box: the ai-box repository, llama.cpp on 8080.
      OPENAI_API_BASE_URL: ${LLAMA_URL:-http://192.168.150.40:8080/v1}
      OPENAI_API_KEY: ${LLAMA_API_KEY:-none}
      # Image generation: ComfyUI on the same box.
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: comfyui
      COMFYUI_BASE_URL: ${COMFY_URL:-http://192.168.150.40:8188}
      IMAGE_GENERATION_MODEL: sd_xl_base_1.0.safetensors
      IMAGE_SIZE: 1024x1024
      IMAGE_STEPS: "28"
    volumes:
      - open-webui:/app/backend/data
    networks:
      lan:
        ipv4_address: ${OPENWEBUI_IP:-192.168.150.51}

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:${OPEN_TERMINAL_TAG:-latest}
    container_name: open-terminal
    restart: unless-stopped
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:?set it in .env, or run install.sh}
    volumes:
      - open-terminal:/home/user
    networks:
      lan:
        ipv4_address: ${OPEN_TERMINAL_IP:-192.168.150.52}

  openclaw:
    image: ghcr.io/openclaw/openclaw:${OPENCLAW_TAG:-latest}
    container_name: openclaw
    restart: unless-stopped
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      # loopback is the default and would make the gateway unreachable from the LAN.
      OPENCLAW_GATEWAY_BIND: lan
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set it in .env, or run install.sh}
      # The model it talks to unless you configure another provider.
      OPENAI_API_KEY: ${LLAMA_API_KEY:-none}
      OPENAI_BASE_URL: ${LLAMA_URL:-http://192.168.150.40:8080/v1}
      TZ: ${TZ:-UTC}
    volumes:
      # bind mount so openclaw.json and the workspace are editable on the host;
      # install.sh creates it owned by uid 1000, which is what the image runs as.
      - ./openclaw:/home/node/.openclaw
    networks:
      lan:
        ipv4_address: ${OPENCLAW_IP:-192.168.150.53}

networks:
  # macvlan: every container gets a real address on the LAN, from the router's
  # point of view a separate machine with a separate MAC.
  lan:
    driver: macvlan
    driver_opts:
      parent: ${LAN_PARENT:-eth0}
    ipam:
      config:
        - subnet: ${LAN_SUBNET:-192.168.150.0/24}
          gateway: ${LAN_GATEWAY:-192.168.150.1}
          # The allocation pool. .50 (the VM) and .54 (the shim) fall inside it,
          # which is only harmless because every service below pins its address.
          ip_range: ${LAN_IP_RANGE:-192.168.150.48/28}

volumes:
  open-webui:
  open-terminal:
